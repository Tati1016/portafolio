<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="ENFOCO, planificador de tareas">
  <defs>
    <linearGradient id="pl-progress" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F76C8E"/>
      <stop offset="1" stop-color="#7C5CE0"/>
    </linearGradient>
  </defs>

  <rect width="960" height="540" fill="#FDF7F8"/>
  <rect x="0" y="0" width="18" height="540" fill="#F76C8E"/>

  <!-- panel de tareas -->
  <g>
    <rect x="72" y="56" width="524" height="336" rx="20" fill="#FFFFFF" stroke="#F0DDE2" stroke-width="3"/>

    <text x="104" y="110" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" font-weight="600" fill="#3A2B33">Mis tareas</text>
    <rect x="104" y="126" width="460" height="3" rx="1.5" fill="#F0DDE2"/>

    <!-- tarea completada -->
    <rect x="104" y="154" width="36" height="36" rx="11" fill="#F76C8E"/>
    <path d="M114 172l7 7 13-14" fill="none" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="158" y="165" width="268" height="15" rx="7.5" fill="#D5C7CD"/>
    <rect x="158" y="170" width="268" height="3.5" rx="1.75" fill="#8E7A83"/>

    <!-- tarea completada -->
    <rect x="104" y="212" width="36" height="36" rx="11" fill="#F76C8E"/>
    <path d="M114 230l7 7 13-14" fill="none" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="158" y="223" width="196" height="15" rx="7.5" fill="#D5C7CD"/>
    <rect x="158" y="228" width="196" height="3.5" rx="1.75" fill="#8E7A83"/>

    <!-- tarea pendiente -->
    <rect x="105.5" y="271.5" width="33" height="33" rx="10" fill="#FFFFFF" stroke="#7C5CE0" stroke-width="4"/>
    <rect x="158" y="276" width="306" height="15" rx="7.5" fill="#5C4A53"/>
    <rect x="158" y="301" width="150" height="11" rx="5.5" fill="#D5C7CD"/>

    <!-- progreso -->
    <text x="104" y="342" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#8E7A83">Progreso</text>
    <rect x="104" y="352" width="460" height="20" rx="10" fill="#F3E7EB"/>
    <rect x="104" y="352" width="306" height="20" rx="10" fill="url(#pl-progress)"/>
  </g>

  <!-- contadores -->
  <g>
    <rect x="628" y="56" width="136" height="118" rx="16" fill="#FFFFFF" stroke="#F0DDE2" stroke-width="3"/>
    <text x="696" y="122" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#F76C8E">2</text>
    <text x="696" y="150" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#8E7A83">Completadas</text>

    <rect x="784" y="56" width="136" height="118" rx="16" fill="#FFFFFF" stroke="#F0DDE2" stroke-width="3"/>
    <text x="852" y="122" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#7C5CE0">1</text>
    <text x="852" y="150" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#8E7A83">Pendiente</text>
  </g>

  <!-- tarjeta de tarea -->
  <g>
    <rect x="628" y="202" width="292" height="132" rx="16" fill="#FFFFFF" stroke="#F0DDE2" stroke-width="3"/>
    <rect x="654" y="228" width="12" height="52" rx="6" fill="#7C5CE0"/>
    <rect x="684" y="232" width="186" height="14" rx="7" fill="#5C4A53"/>
    <rect x="684" y="258" width="122" height="11" rx="5.5" fill="#D5C7CD"/>
    <rect x="654" y="296" width="98" height="22" rx="11" fill="#FDEAEF"/>
    <rect x="766" y="296" width="76" height="22" rx="11" fill="#EFEAFB"/>
  </g>

  <!-- identidad -->
  <text x="72" y="470" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="72" font-weight="700" fill="#3A2B33" letter-spacing="2">ENFOCO</text>
  <rect x="74" y="490" width="66" height="6" rx="3" fill="#F76C8E"/>
  <text x="72" y="524" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" font-weight="500" fill="#8E7A83" letter-spacing="1">Planificador de tareas</text>
</svg>
