<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="VidaFit, ecommerce full stack de suplementos deportivos">
  <defs>
    <linearGradient id="vf-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08182F"/>
      <stop offset="1" stop-color="#12406F"/>
    </linearGradient>
    <linearGradient id="vf-tub" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#CFE1F5"/>
    </linearGradient>
  </defs>

  <rect width="960" height="540" fill="url(#vf-bg)"/>

  <!-- retícula de catálogo, muy sutil -->
  <g stroke="#5B92D6" stroke-width="1.5" opacity="0.12">
    <path d="M0 180h960M0 360h960"/>
    <path d="M320 0v540M640 0v540"/>
  </g>

  <!-- catálogo: dos fichas de producto -->
  <g>
    <rect x="662" y="122" width="130" height="212" rx="14" fill="#14395F" stroke="#3E76B6" stroke-width="3"/>
    <rect x="682" y="144" width="90" height="112" rx="10" fill="#265C97"/>
    <rect x="706" y="166" width="42" height="68" rx="8" fill="#9FC4EC"/>
    <rect x="682" y="272" width="88" height="13" rx="6.5" fill="#8FBBEC"/>
    <rect x="682" y="298" width="52" height="11" rx="5.5" fill="#4E85C4"/>

    <rect x="812" y="122" width="130" height="212" rx="14" fill="#14395F" stroke="#3E76B6" stroke-width="3"/>
    <rect x="832" y="144" width="90" height="112" rx="10" fill="#265C97"/>
    <rect x="856" y="176" width="42" height="58" rx="8" fill="#9FC4EC"/>
    <rect x="832" y="272" width="88" height="13" rx="6.5" fill="#8FBBEC"/>
    <rect x="832" y="298" width="52" height="11" rx="5.5" fill="#4E85C4"/>
  </g>

  <!-- envases de suplementos -->
  <g>
    <!-- envase medio -->
    <rect x="78" y="222" width="116" height="138" rx="14" fill="url(#vf-tub)"/>
    <rect x="92" y="194" width="88" height="32" rx="9" fill="#9FC4EC"/>
    <rect x="98" y="274" width="76" height="14" rx="7" fill="#12406F"/>
    <rect x="98" y="300" width="48" height="11" rx="5.5" fill="#5E8FC4"/>

    <!-- envase principal -->
    <rect x="212" y="166" width="146" height="194" rx="16" fill="url(#vf-tub)"/>
    <rect x="230" y="134" width="110" height="36" rx="10" fill="#2E7BCE"/>
    <circle cx="285" cy="236" r="36" fill="none" stroke="#2E7BCE" stroke-width="9"/>
    <path d="M268 236l13 14 24-27" fill="none" stroke="#2E7BCE" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="236" y="292" width="98" height="15" rx="7.5" fill="#12406F"/>
    <rect x="236" y="320" width="62" height="12" rx="6" fill="#5E8FC4"/>

    <!-- envase bajo -->
    <rect x="376" y="254" width="102" height="106" rx="13" fill="url(#vf-tub)"/>
    <rect x="390" y="230" width="74" height="28" rx="8" fill="#9FC4EC"/>
    <rect x="394" y="288" width="66" height="12" rx="6" fill="#12406F"/>
    <rect x="394" y="312" width="40" height="10" rx="5" fill="#5E8FC4"/>
  </g>

  <!-- carrito de compra -->
  <g stroke="#6FADF2" stroke-width="11" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M506 158h30l36 152h60"/>
    <path d="M546 200h94l-16 78h-60"/>
  </g>
  <circle cx="576" cy="340" r="15" fill="#6FADF2"/>
  <circle cx="620" cy="340" r="15" fill="#6FADF2"/>

  <!-- identidad -->
  <text x="78" y="468" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="82" font-weight="700" fill="#FFFFFF" letter-spacing="-2">VidaFit</text>
  <rect x="80" y="488" width="72" height="6" rx="3" fill="#6FADF2"/>
  <text x="78" y="522" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="500" fill="#9FC4EC" letter-spacing="1.5">Ecommerce Full Stack</text>
</svg>
